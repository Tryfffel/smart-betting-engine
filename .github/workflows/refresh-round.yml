name: Refresh Stryktipset round

on:
  schedule:
    # Every 6 hours: 03:17, 09:17, 15:17, 21:17 UTC (off-peak minute to avoid quota spikes)
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      rows:
        description: 'Max rader för systemet'
        required: false
        default: '100'
      game:
        description: 'stryktipset eller europatipset'
        required: false
        default: 'stryktipset'

permissions:
  contents: write

concurrency:
  group: refresh-round
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agent/package-lock.json

      - name: Install agent dependencies
        working-directory: agent
        run: npm ci

      - name: Run pipeline
        working-directory: agent
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          GAME="${{ github.event.inputs.game || 'stryktipset' }}"
          ROWS="${{ github.event.inputs.rows || '100' }}"
          node cli.js all --game "$GAME" --rows "$ROWS"

      - name: Show output summary
        run: |
          echo "## Output files" >> $GITHUB_STEP_SUMMARY
          for f in agent/output/*.json; do
            [ -e "$f" ] || continue
            size=$(stat -c%s "$f")
            echo "- \`$f\` ($size bytes)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f agent/output/system.json ]; then
            echo "### System" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            jq '{roundNo, totalRows, counts, expectedP13}' agent/output/system.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/output/
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          ROUND=$(jq -r '.roundNo // "?"' agent/output/round-enriched.json 2>/dev/null || echo "?")
          git commit -m "Refresh round data (omg $ROUND) [skip ci]"
          git push
