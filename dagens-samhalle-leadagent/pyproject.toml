[project]
name = "dagens-samhalle-leadagent"
version = "0.1.0"
description = "Lead-research-agent för Dagens Samhälles platsannonsaffär"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "google-api-python-client>=2.196.0",
    "google-auth>=2.52.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
