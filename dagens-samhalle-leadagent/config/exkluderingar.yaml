  # Övrigt brus från Indeed/LinkedIn
  - sales manager
  - account manager
  - sales consultant
  - säljkonsult
  - butiksbiträde

# Sammansatta ord vars sista del räcker för att exkludera annonsen.
# Word-boundary-matchningen för listan ovan fångar inte sammansatta ord som
# "modersmålslärare", "anestesisjuksköterska" osv. Lägg svenska yrkessuffix
# här istället för att räkna upp varje variant.
compound_suffix_exkluderingar:
  - lärare       # modersmålslärare, slöjdlärare, ämneslärare osv
  - pedagog      # fritidspedagog, specialpedagog, klasspedagog
  - sköterska    # sjuksköterska, undersköterska, anestesisjuksköterska
  - läkare       # ST-läkare, husläkare, vikarierande läkare
  - handläggare  # LSS-handläggare, biståndshandläggare, miljöhandläggare
  - arbetare     # vårdarbetare, parkarbetare, byggarbetare
  - skötare      # boendeskötare, djurskötare
  - assistent    # personlig assistent, elevassistent, vårdassistent
  - biträde      # vårdbiträde, måltidsbiträde, butiksbiträde
  - vårdare      # barnvårdare, djurvårdare
