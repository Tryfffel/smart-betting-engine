  - lärare
  - förskollärare
  - fritidspedagog
  - speciallärare
  - specialpedagog
  - rektor              # förändras vid behov — ofta för operativ
  - barnskötare
  - elevassistent

  # Vård och omsorg
  - sjuksköterska
  - undersköterska
  - vårdbiträde
  - personlig assistent
  - boendestödjare
  - habiliteringspersonal
  - omsorgsassistent
  - hemtjänstpersonal
  - skötare

  # Service och drift
  - kock
  - kokerska
  - måltidsbiträde
  - lokalvårdare
  - städare
  - parkarbetare
  - vaktmästare

  # Handläggare / koordinator-nivå – för operativt för annonsförsäljning
  - handläggare
  - koordinator
  - assistent
  - administratör
  - sekreterare
  - registrator
  - kanslist
  - resurspedagog

  # Mellanchefer – per nyligen beslutat skärpt filter
  - avdelningschef
  - enhetschef
  - sektionschef
  - gruppchef
  - områdeschef
  - teamledare
  - team lead
  - biträdande chef
